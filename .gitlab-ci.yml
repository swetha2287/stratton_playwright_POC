stages:
  - test

playwright-test:
  stage: test
  
  script:
    - npm install
    - npx playwright install
    - npx playwright test tests/validateVariables.spec.js --reporter=json 
    - mv playwright-report/results.json failed-pages-results.json || true

  artifacts:
    when: always
    paths:
      - playwright-report
      - /test-results
      - failed-pages-results.json
    expire_in: 1 week
  after_script:
    - echo "Pipeline is working!"
    - ls -R playwright-report/ || echo "No folder found."
    - ls -la failed-pages-results.json || echo "No file found."