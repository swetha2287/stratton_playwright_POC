stages:
  - test

playwright-test:
  stage: test
  
  script:
    - npm install
    - npx playwright install
    - npx playwright test tests/validateVariables.spec.js

  artifacts:
    when: always
    paths:
      - playwright-report
      - failed-tests.json
    expire_in: 1 week
  after_script:
    - echo "Pipeline is working!"
